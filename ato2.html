<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ATO II — Nihil</title>
    <link rel="stylesheet" href="./site.css" />
  </head>
  <body>
    <div class="frame"></div>
    <main class="auth-wrap">
      <div class="auth-card">
        <h1>ATO II</h1>
        <p id="msg" style="text-align: center">Validando assinatura...</p>
        <div id="conteudo" style="display: none; text-align: center">
          <p>Área reservada para o arquivo do ATO II.</p>
          <a class="btn" href="./portal.html">Voltar ao portal</a>
        </div>
      </div>
    </main>
    <script type="module">
      import { auth, db } from "./firebase-config.js";
      import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
      import {
        ref,
        get,
      } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
      onAuthStateChanged(auth, async (u) => {
        if (!u) {
          location.replace("./login.html");
          return;
        }
        const p = (await get(ref(db, `usuarios/${u.uid}`))).val(),
          hoje = new Date().toISOString().slice(0, 10);
        if (
          !p ||
          p.plano !== "experiente" ||
          p.ativo !== true ||
          p.bloqueado === true ||
          (p.validade && p.validade < hoje)
        ) {
          location.replace("./portal.html?acesso=negado");
          return;
        }
        msg.style.display = "none";
        conteudo.style.display = "block";
      });
    </script>
  </body>
</html>
