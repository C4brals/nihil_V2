<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Nihil</title><link rel="stylesheet" href="./site.css"></head><body><div class="frame"></div><nav class="nav"><a class="brand" href="./index.html">NIHIL</a></nav><main class="auth-wrap"><form id="form" class="auth-card"><h1>Acessar campanha</h1><p class="muted" style="text-align:center">Entre com o e-mail credenciado para sua assinatura.</p><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label>Senha</label><input id="senha" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%" type="submit">Entrar</button><div id="msg" class="msg"></div></form></main><script type="module">import {auth,db} from './firebase-config.js';import {signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js';import {ref,get} from 'https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js';const f=document.querySelector('#form'),m=document.querySelector('#msg');async function validar(user){const s=await get(ref(db,`usuarios/${user.uid}`)),p=s.val(),hoje=new Date().toISOString().slice(0,10);if(!p){await signOut(auth);throw new Error('Usuário autenticado, mas ainda não foi liberado pelo administrador.');}if(p.bloqueado===true||p.ativo!==true){await signOut(auth);throw new Error('Seu acesso está bloqueado ou inativo.');}if(p.validade&&p.validade<hoje){await signOut(auth);throw new Error('Sua assinatura está vencida.');}location.replace('./portal.html');}f.addEventListener('submit',async e=>{e.preventDefault();m.className='msg';m.textContent='Validando acesso...';try{const c=await signInWithEmailAndPassword(auth,email.value.trim(),senha.value);await validar(c.user)}catch(err){m.className='msg error';m.textContent=err.message.includes('auth/')?'E-mail ou senha inválidos.':err.message}});</script></body></html>
