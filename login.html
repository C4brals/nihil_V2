<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar — Nihil</title>
    
<style id="nihil-identity-v2">
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap');
:root{--nihil-black:#070505;--nihil-panel:#100b0b;--nihil-red:#8b0000;--nihil-red2:#b31318;--nihil-gold:#c5a059;--nihil-gold2:#e0c17a;--nihil-text:#eadfce;--nihil-muted:#a99a88}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--nihil-text);font-family:'Lora',serif;background:radial-gradient(circle at 50% -10%,rgba(139,0,0,.25),transparent 34%),linear-gradient(rgba(5,3,3,.94),rgba(5,3,3,.97)),repeating-linear-gradient(135deg,#0b0707 0 2px,#070505 2px 7px);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 50% 25%,rgba(197,160,89,.055),transparent 24%),radial-gradient(circle at 50% 100%,rgba(139,0,0,.14),transparent 34%)}
a{color:inherit}.frame{position:fixed;inset:8px;pointer-events:none;z-index:9999;border:1px solid rgba(197,160,89,.38);box-shadow:inset 0 0 0 2px rgba(139,0,0,.18),inset 0 0 28px rgba(0,0,0,.85)}
.nav{min-height:86px;padding:10px clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:24px;position:relative;z-index:20;background:linear-gradient(180deg,rgba(8,5,5,.98),rgba(10,6,6,.88));border-bottom:1px solid rgba(197,160,89,.28);box-shadow:0 8px 28px rgba(0,0,0,.45)}
.brand,.brand-logo{display:inline-flex;align-items:center;text-decoration:none}.brand-logo img{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(139,0,0,.45))}.brand-logo span{font-family:'Cinzel',serif;font-weight:800;letter-spacing:.16em;color:var(--nihil-gold2);font-size:1.15rem;margin-left:8px;text-shadow:0 1px 8px #000}.navlinks,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.navlinks a:not(.btn){text-decoration:none;color:#d7c7b2;font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:.08em}.navlinks a:not(.btn):hover{color:var(--nihil-gold2)}
.btn{appearance:none;border:1px solid rgba(197,160,89,.5);border-radius:5px;padding:11px 18px;background:linear-gradient(#171010,#0a0707);color:#e8dac6;text-decoration:none;font-family:'Cinzel',serif;font-weight:700;letter-spacing:.04em;cursor:pointer;box-shadow:inset 0 0 12px rgba(0,0,0,.55),0 4px 14px rgba(0,0,0,.28)}.btn:hover{border-color:var(--nihil-gold2);transform:translateY(-1px)}.btn.primary{background:linear-gradient(180deg,#981014,#5f0508);border-color:#c69a54;color:#fff3df;box-shadow:inset 0 0 0 1px rgba(255,205,120,.14),0 0 20px rgba(139,0,0,.2)}
.hero{min-height:610px;display:grid;place-items:center;text-align:center;padding:90px 24px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(139,0,0,.25),transparent 28%),linear-gradient(180deg,transparent 50%,#070505 100%);z-index:-1}.hero>div{max-width:820px}.hero h2,.section h2,.card h3,.auth-card h1{font-family:'Cinzel',serif;color:var(--nihil-gold2);text-transform:uppercase;letter-spacing:.1em}.hero h2{font-size:clamp(.8rem,2vw,1.1rem);color:#bca888}.hero h1{font-family:'Cinzel',serif;font-size:clamp(4rem,12vw,8.5rem);line-height:.85;margin:18px 0;color:#d6b466;text-shadow:0 3px 0 #4d250d,0 0 25px rgba(139,0,0,.5);letter-spacing:.08em}.hero p{font-size:1.08rem;line-height:1.75;color:#c9baa8;max-width:690px;margin:0 auto 28px}.hero .actions{justify-content:center}
.section{max-width:1120px;margin:auto;padding:58px 24px}.section>h2{text-align:center;font-size:1.7rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card,.auth-card{background:linear-gradient(145deg,rgba(25,16,16,.96),rgba(8,6,6,.98));border:1px solid rgba(197,160,89,.35);border-left:3px solid #78090c;border-radius:7px;padding:24px;box-shadow:inset 0 0 30px rgba(0,0,0,.45),0 14px 35px rgba(0,0,0,.28)}.card h3{margin-top:0}.price,.badge{font-family:'Cinzel',serif;color:var(--nihil-gold2)}.muted{color:var(--nihil-muted)}.footer{text-align:center;padding:32px;color:#806f60;border-top:1px solid rgba(197,160,89,.16);font-family:'Cinzel',serif;letter-spacing:.08em}
.auth-wrap{min-height:calc(100vh - 86px);display:grid;place-items:center;padding:42px 20px}.auth-card{width:min(440px,100%);position:relative}.auth-card:before{content:"";display:block;width:108px;height:108px;margin:-4px auto 12px;background:url('./icone.png') center/contain no-repeat;filter:drop-shadow(0 0 12px rgba(139,0,0,.38))}.auth-card h1{text-align:center;margin-top:4px}.field{margin:16px 0}.field label,.admin-grid label{display:grid;gap:7px;color:#c9b99f;font-family:'Cinzel',serif;font-size:.78rem}.field input,.admin-input{width:100%;background:#090707;border:1px solid #4e3b2d;color:#f0e4d4;border-radius:4px;padding:12px;outline:none}.field input:focus,.admin-input:focus{border-color:var(--nihil-gold);box-shadow:0 0 0 2px rgba(197,160,89,.08)}.msg{margin-top:12px}.msg.error{color:#e7a3a3}.portal{max-width:1180px;margin:auto;padding:42px 24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(197,160,89,.25);padding-bottom:20px}.badge{border:1px solid rgba(197,160,89,.4);background:#100a0a;padding:9px 13px;border-radius:999px}.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.admin-list-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.admin-search{margin:16px 0}.admin-users{display:grid;gap:12px}
@media(max-width:650px){.nav{padding:10px 18px}.brand-logo img{width:54px;height:54px}.brand-logo span{display:none}.hero{min-height:520px;padding-top:65px}.navlinks a:not(.btn){display:none}.portal{padding:28px 16px}.topbar{align-items:flex-start;flex-direction:column}}
</style>
  </head>
  <body>
    <div class="frame"></div>
    <nav class="nav"><a class="brand-logo" href="./index.html" aria-label="Nihil"><img src="./icone.png" alt="Nihil"><span>NIHIL</span></a></nav>
    <main class="auth-wrap">
      <form id="form" class="auth-card">
        <h1>Acessar campanha</h1>
        <p class="muted" style="text-align: center">
          Entre com o e-mail credenciado para sua assinatura.
        </p>
        <div class="field">
          <label>E-mail</label
          ><input id="email" type="email" autocomplete="email" required />
        </div>
        <div class="field">
          <label>Senha</label
          ><input
            id="senha"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button class="btn primary" style="width: 100%" type="submit">
          Entrar
        </button>
        <div id="msg" class="msg"></div>
      </form>
    </main>
    <script type="module">
      import { auth, db } from "./firebase-config.js";
      import {
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
      import {
        ref,
        get,
      } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
      const f = document.querySelector("#form"),
        m = document.querySelector("#msg");
      async function validar(user) {
        const s = await get(ref(db, `usuarios/${user.uid}`)),
          p = s.val(),
          hoje = new Date().toISOString().slice(0, 10);
        if (!p) {
          await signOut(auth);
          throw new Error(
            "Usuário autenticado, mas ainda não foi liberado pelo administrador.",
          );
        }
        if (p.bloqueado === true || p.ativo !== true) {
          await signOut(auth);
          throw new Error("Seu acesso está bloqueado ou inativo.");
        }
        if (p.validade && p.validade < hoje) {
          await signOut(auth);
          throw new Error("Sua assinatura está vencida.");
        }
        location.replace("./portal.html");
      }
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        m.className = "msg";
        m.textContent = "Validando acesso...";
        try {
          const c = await signInWithEmailAndPassword(
            auth,
            email.value.trim(),
            senha.value,
          );
          await validar(c.user);
        } catch (err) {
          m.className = "msg error";
          m.textContent = err.message.includes("auth/")
            ? "E-mail ou senha inválidos."
            : err.message;
        }
      });
    </script>
  </body>
</html>
